[project]
name = "coachtrack-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.5,<3",
    "pyjwt>=2.9,<3",
    "argon2-cffi>=23.1,<26",
    "alembic>=1.13,<2",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: изолированные модульные тесты", "integration: тесты FastAPI и PostgreSQL"]
